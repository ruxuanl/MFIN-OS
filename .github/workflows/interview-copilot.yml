name: interview-copilot

on:
  pull_request:
    paths:
      - experiments/interview-copilot/**
      - .github/workflows/interview-copilot.yml
  push:
    branches: [main]
    paths:
      - experiments/interview-copilot/**
      - .github/workflows/interview-copilot.yml

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/interview-copilot
    env:
      INTERVIEW_PDF_PYTHON: python3
      INTERVIEW_PDF_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/interview-copilot/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/interview-copilot/requirements.txt
      - name: Install Chinese PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r requirements.txt
      - name: Download local embedding model
        run: npm run setup:model
      - name: Check and test synthetic workflows
        run: |
          npm run check
          npm test
          node eval-retrieval.mjs
